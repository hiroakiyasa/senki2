name: Validate Volume 6 manga scripts

on:
  push:
    paths:
      - "scripts/v06/**"
      - ".github/workflows/validate-v06.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Volume 6 scripts
        run: python scripts/v06/validate_v06.py
